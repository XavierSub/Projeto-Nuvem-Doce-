<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fuga da Prisão Nuvem Doce</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%9A%A8%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Black+Ops+One&family=Space+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">
<style>

  :root{
    --bg:#0c0d0f; --panel:#16181c; --panel2:#1f2228; --line:#30343c;
    --text:#ecebe6; --muted:#9a9ea6; --orange:#ff8a1f; --yellow:#f5c518;
    --red:#ff4d4d; --green:#4ade80; --cyan:#5ce1ff;
  }
  *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
  html,body{background:var(--bg);color:var(--text);font-family:'Space Grotesk',system-ui,sans-serif;min-height:100%}
  body{display:flex;justify-content:center;padding:10px 12px 40px;background:radial-gradient(ellipse at top,#1b1d22 0%,var(--bg) 70%)}
  .app{width:100%;max-width:480px;position:relative}
  .hazard{height:8px;border-radius:4px;background:repeating-linear-gradient(-45deg,var(--yellow) 0 12px,#111 12px 24px);margin-bottom:10px;background-size:34px 34px;animation:haz 1.2s linear infinite}
  @keyframes haz{to{background-position:34px 0}}
  header{display:flex;align-items:center;justify-content:space-between;gap:6px;margin-bottom:8px}
  .locks{display:flex;gap:5px}
  .lock{font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;padding:6px 7px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--muted);transition:.4s;white-space:nowrap}
  .lock.open{border-color:var(--green);color:var(--green);background:rgba(74,222,128,.1)}
  .hud{display:flex;gap:5px;align-items:center}
  .pill{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--yellow);background:var(--panel);border:1px solid var(--line);padding:6px 8px;border-radius:8px;white-space:nowrap}
  .mute{all:unset;cursor:pointer;font-size:15px;padding:4px 6px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
  .prog{display:flex;gap:4px;margin-bottom:12px}
  .prog i{flex:1;height:5px;border-radius:3px;background:var(--panel2);transition:.4s}
  .prog i.on{background:var(--green);box-shadow:0 0 8px rgba(74,222,128,.6)}
  .prog i.cur{background:var(--orange);animation:blink 1s infinite}
  @keyframes blink{50%{opacity:.4}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:18px;overflow:hidden;box-shadow:0 10px 40px rgba(0,0,0,.5)}
  .body{padding:18px 16px 20px}
  .in{animation:in .4s ease both}
  @keyframes in{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  .tag{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;color:var(--orange);text-transform:uppercase;margin-bottom:8px}
  h1{font-family:'Black Ops One',system-ui;font-weight:400;font-size:30px;line-height:1.1;margin-bottom:10px;letter-spacing:.02em}
  h2{font-family:'Black Ops One',system-ui;font-weight:400;font-size:22px;line-height:1.2;margin-bottom:10px;letter-spacing:.02em}
  p{line-height:1.5;color:#d4d3cd;margin-bottom:12px;font-size:15.5px}
  .muted{color:var(--muted);font-size:14px}
  b{color:#fff}
  .story{background:var(--panel2);border-left:3px solid var(--orange);border-radius:10px;padding:12px 14px;margin:12px 0;font-size:15px;line-height:1.5;color:#e2e0d8}
  .type::after{content:'▌';color:var(--orange);animation:blink .8s infinite}
  .type.done::after{content:''}
  .doc{font-family:'JetBrains Mono',monospace;font-size:12.5px;background:#e9e2cf;color:#2b2618;border-radius:6px;padding:12px;margin:12px 0;line-height:1.6;transform:rotate(-1deg);box-shadow:0 4px 0 #b9ad8c}
  .doc .stamp{display:inline-block;border:2px solid #b3261e;color:#b3261e;padding:1px 6px;transform:rotate(-6deg);font-weight:700;margin-top:4px}
  .ficha{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-family:'JetBrains Mono',monospace;font-size:12.5px;background:#0f1012;border:1px solid var(--line);border-radius:10px;padding:12px;margin:12px 0}
  .ficha span:nth-child(odd){color:var(--muted)}
  .ficha span:nth-child(even){color:var(--orange)}
  .opts{display:flex;flex-direction:column;gap:10px;margin-top:14px}
  .opt{all:unset;cursor:pointer;display:flex;gap:12px;align-items:flex-start;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:13px 14px;font-size:15px;line-height:1.4;transition:.15s;animation:in .35s ease both}
  .opt:nth-child(2){animation-delay:.06s}.opt:nth-child(3){animation-delay:.12s}.opt:nth-child(4){animation-delay:.18s}
  .opt:hover{border-color:var(--orange)}
  .opt:active{transform:scale(.98)}
  .opt .k{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--orange);min-width:18px}
  .opt.wrong{border-color:var(--red);opacity:.5;cursor:default;animation:shake .35s}
  .opt.right{border-color:var(--green);background:rgba(74,222,128,.12);animation:pop .4s}
  .opt.sel{border-color:var(--yellow);background:rgba(245,197,24,.08)}
  .opt[aria-disabled="true"]{cursor:default}
  @keyframes pop{50%{transform:scale(1.03)}}
  .btn{all:unset;cursor:pointer;display:block;text-align:center;background:var(--orange);color:#1a0d00;font-weight:700;border-radius:12px;padding:15px;margin-top:16px;font-size:16px;letter-spacing:.02em;box-shadow:0 4px 0 #b35c0a;animation:in .35s ease both}
  .btn:active{transform:translateY(2px);box-shadow:0 2px 0 #b35c0a}
  .btn.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);font-weight:500;margin-top:10px;box-shadow:none}
  .btn.go{background:var(--green);color:#052e14;box-shadow:0 4px 0 #1f8f4b}
  .btn[disabled]{opacity:.35;pointer-events:none}
  .fb{border-radius:12px;padding:14px;margin-top:14px;font-size:15px;line-height:1.5;animation:in .3s ease}
  .fb.bad{background:rgba(255,77,77,.08);border:1px solid rgba(255,77,77,.4)}
  .fb.good{background:rgba(74,222,128,.08);border:1px solid rgba(74,222,128,.45)}
  .fb h3{font-size:16px;margin-bottom:6px}
  .fb ul{padding-left:18px;margin:6px 0}
  .fb li{margin:4px 0}
  .fb p:last-child{margin-bottom:0}
  .reflect{margin-top:16px;padding:14px;border-radius:12px;background:rgba(245,197,24,.07);border:1px solid rgba(245,197,24,.35)}
  .reflect .tag{color:var(--yellow)}
  .chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .chip{all:unset;cursor:pointer;padding:8px 12px;border-radius:999px;border:1px solid var(--line);background:var(--panel2);font-size:14px;transition:.15s}
  .chip.on{border-color:var(--yellow);background:rgba(245,197,24,.15)}
  /* mito ou verdade */
  .mvcount{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);margin-bottom:8px}
  .mvcard{perspective:800px;margin:10px 0}
  .mvinner{position:relative;min-height:150px;transition:transform .6s;transform-style:preserve-3d}
  .mvcard.flip .mvinner{transform:rotateY(180deg)}
  .mvface{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:14px;padding:18px;display:flex;flex-direction:column;justify-content:center}
  .mvfront{background:#e9e2cf;color:#1d1a12;font-size:18px;font-weight:700;line-height:1.35;box-shadow:0 5px 0 #b9ad8c;text-align:center}
  .mvfront small{display:block;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#7a6c4a;margin-bottom:8px;letter-spacing:.1em}
  .mvback{transform:rotateY(180deg);background:var(--panel2);border:2px solid var(--green);font-size:14.5px;line-height:1.45}
  .mvback.no{border-color:var(--red)}
  .mvback h4{font-size:17px;margin-bottom:6px}
  .mvbtns{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .mvbtns button{all:unset;cursor:pointer;text-align:center;padding:14px;border-radius:12px;font-weight:700;font-size:16px}
  .bm{background:rgba(255,77,77,.12);border:1px solid var(--red);color:#ffb3b3}
  .bv{background:rgba(74,222,128,.12);border:1px solid var(--green);color:#b9f5cf}
  /* scanner */
  .scan{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px;padding:10px;border-radius:12px;background:#07140f;border:1px solid #1d4a37;overflow:hidden}
  .scan::before{content:'';position:absolute;left:0;right:0;height:40px;background:linear-gradient(180deg,transparent,rgba(74,222,128,.25),transparent);animation:scanline 2.4s linear infinite;pointer-events:none}
  @keyframes scanline{from{top:-40px}to{top:100%}}
  .sc{all:unset;cursor:pointer;padding:11px 10px;border-radius:10px;border:1px solid #1d4a37;background:#0b1e17;font-size:13.5px;line-height:1.3;text-align:center;transition:.15s;position:relative}
  .sc.on{border-color:var(--green);background:rgba(74,222,128,.18);box-shadow:0 0 12px rgba(74,222,128,.35)}
  .sc.miss{border-color:var(--yellow);animation:shake .35s}
  .sc.bad{border-color:var(--red);animation:shake .35s}
  /* ordem */
  .order{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  .slot{min-height:46px;border:1px dashed var(--line);border-radius:10px;display:flex;align-items:center;gap:10px;padding:10px 12px;font-size:14.5px;color:var(--muted)}
  .slot.filled{border-style:solid;border-color:var(--yellow);color:var(--text);background:rgba(245,197,24,.06);animation:pop .3s}
  .slot .n{font-family:'JetBrains Mono',monospace;color:var(--yellow);font-weight:700}
  .pool{display:flex;flex-direction:column;gap:8px;margin-top:12px}
  /* disco */
  .dialwrap{display:flex;flex-direction:column;align-items:center;margin:10px 0}
  .dialwrap svg{width:210px;height:210px}
  .ring{transform-origin:100px 100px;transition:transform .45s cubic-bezier(.3,1.4,.5,1)}
  .dialbtns{display:flex;gap:12px;margin-top:8px;align-items:center}
  .dialbtns button{all:unset;cursor:pointer;width:52px;height:52px;border-radius:50%;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center;font-size:20px}
  .dialbtns button:active{transform:scale(.92)}
  .dialval{font-family:'JetBrains Mono',monospace;font-size:28px;font-weight:700;color:var(--yellow);min-width:90px;text-align:center}
  /* caça às iscas */
  .post{background:#fff;color:#111;border-radius:14px;overflow:hidden;margin:12px 0}
  .post .ph{height:100px;background:linear-gradient(135deg,#ff6fd8,#7a5cff 55%,#22d3ee);display:grid;place-items:center;font-size:40px;position:relative}
  .post .pb{padding:10px 12px;font-size:15px;line-height:1.6}
  .post .pu{font-weight:700;font-size:13px;margin-bottom:4px}
  .post .ps{color:#555;font-size:12.5px;margin-top:8px;display:flex;gap:10px;flex-wrap:wrap}
  .seg{cursor:pointer;border-radius:4px;padding:1px 2px;transition:.2s;border-bottom:2px dotted transparent}
  .hunting .seg{border-bottom-color:#c9c9c9}
  .seg.found{background:#ffe0e0;border-bottom:2px solid #e11;color:#900}
  .seg.nope{animation:shake .35s;background:#eee}
  .baitlog{display:flex;flex-direction:column;gap:6px;margin-top:8px}
  .bait{font-size:13.5px;padding:8px 10px;border-radius:8px;background:rgba(255,77,77,.08);border:1px solid rgba(255,77,77,.35);animation:in .3s}
  .counter{font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--yellow);margin-top:4px}
  .comment{background:#f3f3f3;color:#222;border-radius:10px;padding:8px 10px;font-size:14px;margin:0 12px 12px}
  .comment b{color:#111}
  /* chat */
  .chat{display:flex;flex-direction:column;gap:6px;margin:12px 0;min-height:40px}
  .bub{max-width:82%;padding:9px 12px;border-radius:14px;font-size:14.5px;line-height:1.4;background:var(--panel2);border:1px solid var(--line);align-self:flex-start;animation:in .3s}
  .bub.me{align-self:flex-end;background:rgba(255,138,31,.15);border-color:var(--orange)}
  .bub small{display:block;color:var(--orange);font-size:11px;margin-bottom:2px;font-weight:700}
  .dots{display:inline-flex;gap:4px;padding:12px 14px}
  .dots i{width:6px;height:6px;border-radius:50%;background:var(--muted);animation:dot 1s infinite}
  .dots i:nth-child(2){animation-delay:.15s}.dots i:nth-child(3){animation-delay:.3s}
  @keyframes dot{0%,100%{opacity:.3;transform:none}50%{opacity:1;transform:translateY(-3px)}}
  /* final */
  .pillars{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
  .pillar{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:12px;animation:in .4s both}
  .pillar:nth-child(2){animation-delay:.1s}.pillar:nth-child(3){animation-delay:.2s}.pillar:nth-child(4){animation-delay:.3s}
  .pillar .i{font-size:22px}
  .pillar h4{font-size:14px;margin:6px 0 4px}
  .pillar p{font-size:13px;margin:0;color:var(--muted);line-height:1.4}
  .tips{list-style:none;margin:10px 0}
  .tips li{padding:10px 0;border-bottom:1px solid var(--line);font-size:14.5px;line-height:1.45}
  .tips li:last-child{border:none}
  .stars{text-align:center;font-size:40px;letter-spacing:6px;margin:4px 0}
  .stars span{display:inline-block;animation:starpop .5s both}
  .stars span:nth-child(2){animation-delay:.25s}.stars span:nth-child(3){animation-delay:.5s}
  .stars .off{filter:grayscale(1);opacity:.25}
  @keyframes starpop{from{transform:scale(0) rotate(-90deg)}70%{transform:scale(1.3)}to{transform:none}}
  .rank{text-align:center;font-family:'Black Ops One';font-size:20px;color:var(--yellow);margin-bottom:6px}
  .stat{display:flex;justify-content:space-around;margin:10px 0 4px;font-family:'JetBrains Mono',monospace}
  .stat div{text-align:center}
  .stat span{display:block;font-size:22px;color:var(--green);font-weight:700}
  .stat small{color:var(--muted);font-size:11px}

  /* ---------- Cenas ---------- */
  .scene{position:relative;width:100%;aspect-ratio:9/5;background:#000;overflow:hidden;border-bottom:3px solid #000}
  .scene svg{display:block;width:100%;height:100%}
  .scene .label{position:absolute;left:10px;bottom:10px;font-family:'JetBrains Mono',monospace;font-size:10.5px;font-weight:700;letter-spacing:.1em;background:rgba(0,0,0,.7);color:var(--yellow);padding:4px 8px;border-radius:4px;border:1px solid rgba(245,197,24,.4)}
  .plocks{position:absolute;right:8px;bottom:8px;display:flex;gap:4px}
  .plocks span{width:28px;height:28px;border-radius:7px;background:rgba(0,0,0,.75);border:1px solid rgba(255,255,255,.2);display:grid;place-items:center;font-size:14px;transition:.3s}
  .plocks span.ok{border-color:var(--green);background:rgba(20,60,35,.9);animation:lockpop .5s}
  @keyframes lockpop{30%{transform:scale(1.5) rotate(-15deg)}60%{transform:scale(.9) rotate(8deg)}}
  .flash{position:absolute;inset:0;pointer-events:none;opacity:0}
  .flash.red{background:rgba(255,40,40,.45);animation:fl .5s}
  .flash.white{background:rgba(255,255,255,.85);animation:fl .7s}
  @keyframes fl{0%{opacity:1}100%{opacity:0}}
  .spark{position:absolute;width:5px;height:5px;border-radius:50%;background:#ffd86b;box-shadow:0 0 8px #ffb300;pointer-events:none;animation:spark .9s ease-out forwards}
  @keyframes spark{to{transform:translate(var(--dx),var(--dy));opacity:0}}
  .bars{transition:transform 1.4s cubic-bezier(.6,0,.3,1)}
  .scene.open .bars{transform:translateY(-230px)}
  .scene.open .gate-l{transform:translateX(-200px)}
  .scene.open .gate-r{transform:translateX(200px)}
  .gate-l,.gate-r{transition:transform 1.4s cubic-bezier(.6,0,.3,1)}
  .alarm{animation:alarm 1s infinite}
  .scene.open .alarm{animation:none;fill:#4ade80}
  @keyframes alarm{0%,100%{fill:#ff3b3b;opacity:1}50%{fill:#7a1010;opacity:.6}}
  .alarm-glow{animation:glow 1s infinite}
  .scene.open .alarm-glow{animation:none;fill:#4ade80;opacity:.25}
  @keyframes glow{0%,100%{opacity:.35}50%{opacity:0}}
  .fog{animation:drift 9s ease-in-out infinite}
  .fog2{animation:drift 12s ease-in-out infinite reverse}
  @keyframes drift{0%,100%{transform:translateX(-14px)}50%{transform:translateX(18px)}}
  .scene.open .fog,.scene.open .fog2{opacity:0;transition:opacity 1.5s}
  .podglow{animation:pod 2s infinite}
  @keyframes pod{0%,100%{opacity:.9}50%{opacity:.3}}
  .guard{animation:patrol 11s linear infinite}
  @keyframes patrol{0%{transform:translateX(-70px)}45%{transform:translateX(420px)}100%{transform:translateX(420px)}}
  .scene.open .guard{display:none}
  .bob{animation:bob .5s ease-in-out infinite alternate}
  @keyframes bob{to{transform:translateY(-2px)}}
  .dial{transform-origin:250px 120px;animation:spin 6s linear infinite}
  .scene.open .dial{animation:spin .6s linear 3}
  @keyframes spin{to{transform:rotate(360deg)}}
  .safe-door{transform-origin:196px 120px;transition:transform 1.4s ease .4s}
  .scene.open .safe-door{transform:perspective(400px) rotateY(-75deg)}
  .keyglow{animation:pod 1.2s infinite}
  .beam{transform-origin:52px 52px;animation:sweep 5s ease-in-out infinite}
  @keyframes sweep{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(38deg)}}
  .clank{position:absolute;inset:0;display:grid;place-items:center;font-family:'Black Ops One';font-size:36px;color:var(--green);text-shadow:0 0 18px rgba(74,222,128,.8),0 3px 0 #000;opacity:0;pointer-events:none}
  .scene.open .clank{animation:clank 1.6s ease forwards}
  @keyframes clank{0%{opacity:0;transform:scale(.6)}20%{opacity:1;transform:scale(1.15)}70%{opacity:1;transform:scale(1)}100%{opacity:0}}
  .shake{animation:shake .4s}
  @keyframes shake{20%,60%{transform:translateX(-6px)}40%,80%{transform:translateX(6px)}}
  .sun{animation:rise 2s ease forwards}
  @keyframes rise{from{transform:translateY(40px)}to{transform:none}}
  .rays{transform-origin:180px 120px;animation:spin 40s linear infinite}
  .walker{animation:walk 3s ease-in-out forwards}
  @keyframes walk{from{transform:translate(0,0)}to{transform:translate(0,-28px) scale(.8)}}
  .flicker{animation:flick 3s infinite}
  @keyframes flick{0%,92%,100%{opacity:1}94%{opacity:.4}96%{opacity:.9}97%{opacity:.3}}
  .bird{animation:fly 9s linear infinite}
  @keyframes fly{from{transform:translateX(-80px)}to{transform:translateX(420px)}}

  /* ---------- Pontos ---------- */
  .pts{position:fixed;left:50%;top:90px;transform:translateX(-50%);font-family:'Black Ops One';font-size:30px;color:var(--yellow);text-shadow:0 3px 0 #000,0 0 14px rgba(245,197,24,.7);pointer-events:none;z-index:50;animation:pts 1.1s ease-out forwards}
  @keyframes pts{0%{opacity:0;transform:translate(-50%,10px) scale(.6)}25%{opacity:1;transform:translate(-50%,0) scale(1.15)}100%{opacity:0;transform:translate(-50%,-50px)}}

  /* ---------- Transição de fase ---------- */
  .tr{position:fixed;inset:0;z-index:100;background:#050506;display:flex;flex-direction:column;justify-content:center;align-items:center;overflow:hidden;cursor:pointer}
  .tr .strip{position:absolute;left:-10%;right:-10%;height:34px;background:repeating-linear-gradient(-45deg,var(--yellow) 0 18px,#111 18px 36px)}
  .tr .s1{top:14%;animation:strip 2.6s linear both}
  .tr .s2{bottom:14%;animation:strip 2.6s linear reverse both}
  @keyframes strip{from{transform:translateX(-120px)}to{transform:translateX(120px)}}
  .tr .sweep{position:absolute;width:160%;height:160%;background:conic-gradient(from 0deg,rgba(255,40,40,.35),transparent 18%,transparent 50%,rgba(255,40,40,.35) 68%,transparent 86%);animation:spin 1.6s linear infinite}
  .tr .box{position:relative;text-align:center;padding:0 20px}
  .tr .n{font-family:'JetBrains Mono',monospace;color:var(--orange);letter-spacing:.3em;font-size:14px;animation:in .4s .1s both}
  .tr .t{font-family:'Black Ops One';font-size:42px;line-height:1.05;margin:8px 0;animation:slam .5s .25s both}
  .tr .sub{color:var(--muted);font-size:16px;animation:in .4s .6s both}
  .tr .skip{position:absolute;bottom:22px;font-family:'JetBrains Mono',monospace;font-size:11px;color:#666}
  @keyframes slam{from{opacity:0;transform:scale(2.2)}60%{opacity:1;transform:scale(.95)}to{transform:none}}
  .tr.out{animation:trout .45s forwards}
  @keyframes trout{to{opacity:0;transform:scale(1.08)}}
  .confetti{position:fixed;top:-20px;width:9px;height:14px;z-index:60;pointer-events:none;animation:fall linear forwards}
  @keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
  @media (prefers-reduced-motion:reduce){*{animation-duration:.01s!important;transition-duration:.01s!important}}

  /* ---------- HUD do personagem ---------- */
  .status{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:8px 10px;margin-bottom:8px}
  .status .av{width:38px;height:46px;flex:none;border-radius:8px;background:#0f1012;overflow:hidden}
  .status .nm{font-weight:700;font-size:13px;max-width:90px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .status .perk{font-size:11px;color:var(--muted)}
  .meters{flex:1;display:flex;flex-direction:column;gap:5px}
  .meter{display:flex;align-items:center;gap:6px;font-family:'JetBrains Mono',monospace;font-size:10px;color:var(--muted)}
  .meter .bar{flex:1;height:8px;border-radius:5px;background:#0f1012;overflow:hidden;border:1px solid #2a2d33}
  .meter .fill{height:100%;border-radius:5px;transition:width .8s cubic-bezier(.3,1.3,.5,1),background .5s}
  .meter .v{min-width:24px;text-align:right}
  .meter.f .fill{background:linear-gradient(90deg,#4ade80,#5ce1ff)}
  .meter.f.low .fill{background:linear-gradient(90deg,#ff4d4d,#ffb547)}
  .meter.d .fill{background:linear-gradient(90deg,#a855f7,#ff4dd2)}
  .meter.hit{animation:shake .4s}
  .delta{position:fixed;left:50%;top:150px;transform:translateX(-50%);font-family:'Black Ops One';font-size:22px;pointer-events:none;z-index:55;text-shadow:0 3px 0 #000;animation:pts 1.6s ease-out forwards;white-space:nowrap}
  .hidden{display:none!important}

  /* ---------- Tela título ---------- */
  .titlecard{text-align:center;padding:26px 18px}
  .titlecard h1{font-size:38px}
  .titlecard .badge{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.15em;color:var(--yellow);border:1px solid rgba(245,197,24,.4);padding:4px 10px;border-radius:999px;margin-bottom:14px}

  /* ---------- Criação de personagem ---------- */
  .creator .preview{display:flex;align-items:center;gap:14px;background:#0f1012;border:1px solid var(--line);border-radius:14px;padding:12px;margin-bottom:12px}
  .creator .preview svg{width:110px;height:146px;flex:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.6))}
  .creator .mug{font-family:'JetBrains Mono',monospace;font-size:12px;line-height:1.7;color:var(--muted)}
  .creator .mug b{color:var(--orange)}
  .creator input{all:unset;box-sizing:border-box;width:100%;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:12px;font-size:16px;color:var(--text)}
  .creator input:focus{border-color:var(--orange)}
  .row{margin:12px 0}
  .row .lbl{font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.1em;color:var(--muted);margin-bottom:6px;text-transform:uppercase}
  .sw{display:flex;gap:8px;flex-wrap:wrap}
  .sw button{all:unset;cursor:pointer;width:34px;height:34px;border-radius:50%;border:3px solid transparent;box-shadow:0 0 0 1px var(--line)}
  .sw button.on{border-color:#fff;transform:scale(1.1)}
  .tx button{width:auto;height:auto;border-radius:999px;padding:7px 12px;font-size:13.5px;background:var(--panel2);border:1px solid var(--line);box-shadow:none}
  .tx button.on{border-color:var(--orange);background:rgba(255,138,31,.15);transform:none}
  .perks{display:grid;grid-template-columns:1fr;gap:8px}
  .perkc{all:unset;cursor:pointer;display:flex;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:var(--panel2);border:1px solid var(--line)}
  .perkc .pi{font-size:24px}
  .perkc b{display:block;font-size:14.5px}
  .perkc small{color:var(--muted);font-size:12.5px;line-height:1.35}
  .perkc.on{border-color:var(--orange);background:rgba(255,138,31,.12)}

  /* ---------- Escolhas ---------- */
  .choice-tag{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:11px;letter-spacing:.12em;color:#1a0d00;background:var(--yellow);padding:3px 8px;border-radius:4px;margin-bottom:8px;animation:blink 1.2s infinite}
  .npc{display:flex;gap:10px;align-items:flex-start;margin:12px 0}
  .npc .face{font-size:34px;line-height:1;flex:none;width:48px;height:48px;border-radius:12px;background:var(--panel2);border:1px solid var(--line);display:grid;place-items:center}
  .npc .say{background:var(--panel2);border:1px solid var(--line);border-radius:4px 14px 14px 14px;padding:10px 12px;font-size:15px;line-height:1.45}
  .npc .say small{display:block;color:var(--orange);font-weight:700;font-size:11px;margin-bottom:2px}
  .ch{all:unset;cursor:pointer;display:block;background:var(--panel2);border:1px solid var(--line);border-left:4px solid var(--yellow);border-radius:12px;padding:13px 14px;font-size:15px;line-height:1.4;animation:in .35s both}
  .ch:active{transform:scale(.98)}
  .ch.dim{opacity:.35;pointer-events:none}
  .ch.pick{border-color:var(--yellow);background:rgba(245,197,24,.1)}
  .conseq{border-radius:12px;padding:14px;margin-top:14px;font-size:15px;line-height:1.5;animation:in .35s}
  .conseq.good{background:rgba(74,222,128,.08);border:1px solid rgba(74,222,128,.45)}
  .conseq.bad{background:rgba(168,85,247,.1);border:1px solid rgba(168,85,247,.5)}
  .conseq .fx{display:flex;gap:8px;flex-wrap:wrap;margin-top:8px}
  .conseq .fx span{font-family:'JetBrains Mono',monospace;font-size:12px;padding:4px 8px;border-radius:6px;background:#0f1012;border:1px solid var(--line)}
  .hintbtn{all:unset;cursor:pointer;font-size:13px;color:var(--cyan);border:1px dashed var(--cyan);border-radius:8px;padding:7px 10px;margin-top:10px;display:inline-block}

  /* ---------- Respiração ---------- */
  .breath{display:flex;flex-direction:column;align-items:center;margin:14px 0}
  .bcirc{width:90px;height:90px;border-radius:50%;background:radial-gradient(circle,#5ce1ff 0%,#2563eb 70%);box-shadow:0 0 30px rgba(92,225,255,.5);transform:scale(1);transition:transform 3s ease-in-out}
  .bcirc.big{transform:scale(1.7)}
  .blbl{margin-top:34px;font-family:'JetBrains Mono',monospace;font-size:13px;color:var(--cyan);text-align:center;min-height:20px}
  .bdots{display:flex;gap:6px;margin-top:8px}
  .bdots i{width:10px;height:10px;border-radius:50%;background:var(--panel2);border:1px solid var(--line)}
  .bdots i.on{background:var(--cyan)}
  .holdbtn{touch-action:none;user-select:none;-webkit-user-select:none}
  .crave{animation:crave 2.2s ease-in-out infinite}
  @keyframes crave{0%,100%{filter:none}50%{filter:blur(1.5px) saturate(1.6) hue-rotate(-20deg)}}

  /* ---------- Corrida ---------- */
  .runner{transition:transform 2.2s cubic-bezier(.4,0,.6,1)}
  .scene.run .runner{transform:translateX(230px)}
  .scene.runfail .runner{transform:translateX(110px);transition:transform 1.4s ease-out}
  .scene.run .runner .bob,.scene.runfail .runner .bob{animation:bob .18s infinite alternate}
  .scene.caught .beam{animation:none;transform:rotate(20deg)}

  /* ---------- Ranking ---------- */
  .tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:10px 0}
  .tabs button{all:unset;cursor:pointer;text-align:center;padding:10px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:14px;font-weight:700}
  .tabs button.on{border-color:var(--yellow);color:var(--yellow);background:rgba(245,197,24,.08)}
  .rk{display:flex;flex-direction:column;gap:6px}
  .rr{display:flex;align-items:center;gap:10px;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:8px 10px;animation:in .3s both}
  .rr.me{border-color:var(--orange);background:rgba(255,138,31,.1)}
  .rr .pos{font-family:'Black Ops One';font-size:18px;min-width:30px;text-align:center;color:var(--muted)}
  .rr .av{width:30px;height:40px;flex:none}
  .rr .who{flex:1;min-width:0}
  .rr .who b{display:block;font-size:14.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .rr .who small{color:var(--muted);font-size:11.5px}
  .rr .sc2{font-family:'JetBrains Mono',monospace;font-weight:700;color:var(--yellow);font-size:15px}
  .empty{text-align:center;color:var(--muted);padding:20px 10px;font-size:14px;line-height:1.5}
  .recap{list-style:none;margin:8px 0}
  .recap li{padding:8px 0;border-bottom:1px solid var(--line);font-size:14px;line-height:1.4}
  .recap li:last-child{border:none}
  .breakdown{font-family:'JetBrains Mono',monospace;font-size:12.5px;background:#0f1012;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin:10px 0;line-height:1.8}
  .breakdown div{display:flex;justify-content:space-between}
  .breakdown .tot{border-top:1px solid var(--line);margin-top:4px;padding-top:4px;color:var(--yellow);font-weight:700}

  /* ---------- Novas cenas ---------- */
  .ecg{stroke-dasharray:220;stroke-dashoffset:220;animation:ecg 2.2s linear infinite}
  .ecg.fast{animation-duration:.9s}
  @keyframes ecg{to{stroke-dashoffset:-220}}
  .spot{animation:pod 1.6s infinite}
  .bulb{transform-origin:200px 0;animation:swing 3s ease-in-out infinite}
  @keyframes swing{0%,100%{transform:rotate(-8deg)}50%{transform:rotate(8deg)}}
  .chaser{transition:transform .9s cubic-bezier(.3,1.3,.5,1)}
  .scene.d1 .chaser{transform:translateX(55px)}
  .scene.d2 .chaser{transform:translateX(105px)}
  .scene.escaped .chaser{transform:translateX(-120px);transition:transform 1.4s}
  .corr-run .bob{animation:bob .18s infinite alternate}
  .glowexit{animation:pod 1.4s infinite}
  .lit{animation:litp 1s ease}
  @keyframes litp{50%{transform:scale(1.25)}}
  .organ{transition:fill .4s,opacity .4s;transform-box:fill-box;transform-origin:center}

  /* ---------- Transição de fase extra ---------- */
  .tr.extra .strip{background:repeating-linear-gradient(-45deg,#ff3b3b 0 18px,#111 18px 36px)}
  .tr.extra .n{color:#ff6b6b}
  .tr.extra .sweep{background:conic-gradient(from 0deg,rgba(255,40,40,.55),transparent 18%,transparent 50%,rgba(255,40,40,.55) 68%,transparent 86%)}

  /* ---------- Ligar pares (corpo) ---------- */
  .bodymap{display:flex;gap:12px;align-items:flex-start;margin:10px 0}
  .bodymap svg{width:96px;flex:none}
  .organs{display:flex;flex-direction:column;gap:8px;flex:1}
  .organs button,.effects button{all:unset;cursor:pointer;padding:10px 12px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:14px;line-height:1.35;transition:.15s}
  .organs button.sel{border-color:var(--yellow);background:rgba(245,197,24,.12);transform:translateX(4px)}
  .organs button.ok,.effects button.ok{border-color:var(--green);background:rgba(74,222,128,.1);pointer-events:none}
  .effects{display:flex;flex-direction:column;gap:8px;margin-top:6px}
  .effects button.bad,.organs button.bad{border-color:var(--red);animation:shake .35s}
  .pairtag{display:inline-block;font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--green);margin-right:6px}

  /* ---------- Perseguição ---------- */
  .doors{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
  .door{all:unset;cursor:pointer;text-align:center;padding:16px 10px;border-radius:10px 10px 4px 4px;background:linear-gradient(180deg,#3a3f47,#24272c);border:2px solid #555;font-weight:700;font-size:15px;box-shadow:inset 0 -6px 0 rgba(0,0,0,.4)}
  .door small{display:block;font-size:22px;margin-bottom:4px}
  .door:active{transform:scale(.97)}
  .door.ok{border-color:var(--green)}
  .door.bad{border-color:var(--red);animation:shake .35s}
  .dist{display:flex;align-items:center;gap:8px;font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--muted);margin:8px 0}
  .dist i{width:22px;height:10px;border-radius:3px;background:var(--panel2);border:1px solid var(--line)}
  .dist i.on{background:var(--red);box-shadow:0 0 8px rgba(255,77,77,.6)}
  .qcard{background:#e9e2cf;color:#1d1a12;border-radius:12px;padding:14px;font-weight:700;font-size:16.5px;line-height:1.35;text-align:center;box-shadow:0 4px 0 #b9ad8c;margin-top:10px;animation:in .3s}
  .qcard small{display:block;font-family:'JetBrains Mono',monospace;font-size:10.5px;color:#7a6c4a;margin-bottom:6px;letter-spacing:.1em}

  /* ---------- Varal ---------- */
  .varal textarea{all:unset;box-sizing:border-box;display:block;width:100%;min-height:86px;background:#fffaf0;color:#2b2618;border-radius:10px;padding:12px;font-size:16px;line-height:1.4;font-family:'Space Grotesk',sans-serif;white-space:pre-wrap}
  .varal .cnt{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--muted);text-align:right;margin-top:4px}
  .line{position:relative;height:40px;margin:18px 0 0}
  .line::before{content:'';position:absolute;left:-6px;right:-6px;top:10px;height:2px;background:#a58a5c;border-radius:2px;transform:rotate(-1deg)}
  .postit{position:relative;margin:-14px auto 0;max-width:300px;background:#fff6c9;color:#2b2618;padding:20px 16px 16px;border-radius:4px;font-size:16px;line-height:1.4;box-shadow:0 8px 16px rgba(0,0,0,.4);transform-origin:top center;animation:hang 1.6s ease both;font-weight:500}
  .postit::before{content:'';position:absolute;top:-12px;left:50%;width:12px;height:26px;margin-left:-6px;background:#c98a3a;border-radius:3px;box-shadow:inset 0 -4px 0 rgba(0,0,0,.2)}
  @keyframes hang{0%{transform:translateY(-30px) rotate(-14deg);opacity:0}40%{transform:rotate(8deg);opacity:1}70%{transform:rotate(-4deg)}100%{transform:rotate(1.5deg)}}

  /* ---------- Certificado ---------- */
  .cert{position:relative;background:linear-gradient(135deg,#fffaf0,#f3e7c9);color:#2b2618;border-radius:12px;padding:22px 18px;margin:16px 0;border:3px double #b48a3c;text-align:center;box-shadow:0 10px 24px rgba(0,0,0,.45)}
  .cert .ct{font-family:'Black Ops One';font-size:22px;color:#7a4b12;letter-spacing:.04em}
  .cert .cn{font-family:'Black Ops One';font-size:28px;margin:8px 0 4px;color:#1d1a12;word-break:break-word}
  .cert p{color:#4a412d;font-size:14px;margin-bottom:8px}
  .cert .seal{position:absolute;right:12px;bottom:10px;width:58px;height:58px;border-radius:50%;background:radial-gradient(circle,#e0a83a,#a8701a);display:grid;place-items:center;font-size:24px;box-shadow:0 3px 0 #7a4b12;transform:rotate(-12deg)}
  .cert .msg{font-style:italic;background:rgba(255,255,255,.6);border-radius:8px;padding:8px 10px;margin:10px 30px 6px;font-size:14px}
  .cert .meta{font-family:'JetBrains Mono',monospace;font-size:11px;color:#6b5d3d}
  .cert b{color:#7a4b12}
  .cert{padding-bottom:78px}
  .cert .seal{right:auto;left:50%;bottom:12px;margin-left:-29px}
  /* ---------- Narradora Brisa ---------- */
  .narr{position:fixed;left:50%;bottom:12px;width:min(460px,calc(100% - 20px));transform:translate(-50%,160%);display:flex;gap:8px;align-items:flex-end;z-index:90;transition:transform .5s cubic-bezier(.3,1.4,.5,1);pointer-events:none}
  .narr.show{transform:translate(-50%,0)}
  .narr .brisa{width:70px;height:62px;flex:none;animation:floaty 2.4s ease-in-out infinite;filter:drop-shadow(0 6px 10px rgba(0,0,0,.5))}
  .narr .brisa svg{width:100%;height:100%}
  @keyframes floaty{50%{transform:translateY(-6px) rotate(-3deg)}}
  .narr .nb{pointer-events:auto;position:relative;flex:1;background:#eefaff;color:#12303c;border-radius:16px 16px 16px 4px;padding:9px 34px 10px 12px;font-size:14.5px;line-height:1.4;box-shadow:0 10px 26px rgba(0,0,0,.55);border:2px solid #9fe6ff;min-height:44px}
  .narr .nb small{display:block;font-family:'JetBrains Mono',monospace;font-size:10px;font-weight:700;letter-spacing:.1em;color:#0e7490;margin-bottom:2px}
  .narr .nb .ctl{position:absolute;top:6px;right:6px;display:flex;flex-direction:column;gap:4px}
  .narr .nb .ctl button{all:unset;cursor:pointer;width:22px;height:22px;border-radius:50%;background:#d4f1fb;color:#12303c;display:grid;place-items:center;font-size:11px}
  .mouth{transform-box:fill-box;transform-origin:center}
  .narr.talk .mouth{animation:talk .2s infinite alternate}
  @keyframes talk{from{transform:scaleY(.25)}to{transform:scaleY(1.3)}}
  .wind{animation:windy 1.6s ease-in-out infinite;opacity:.8}
  @keyframes windy{50%{transform:translateX(-4px);opacity:.3}}
  .listen{all:unset;cursor:pointer;font-size:12.5px;color:var(--cyan);border:1px solid rgba(92,225,255,.45);border-radius:999px;padding:4px 10px;margin-top:8px;display:inline-block}
  body.novoice .listen{display:none}
  .mute.off{opacity:.5}
  .hello{display:flex;align-items:center;gap:10px;justify-content:center;margin:6px 0 14px}
  .hello .b{width:70px;height:62px;animation:floaty 2.4s ease-in-out infinite}
  .hello .t{font-size:13.5px;color:var(--muted);text-align:left;max-width:220px;line-height:1.4}
  body{padding-bottom:110px}
  .body{position:relative}
  .relisten{all:unset;cursor:pointer;position:absolute;top:12px;right:12px;z-index:3;font-size:12px;font-weight:700;color:#12303c;background:#bdeefc;border-radius:999px;padding:5px 10px;box-shadow:0 2px 0 #6fc7e0}
  .relisten:active{transform:translateY(1px)}
  body.novoice .relisten,body.narroff .relisten{display:none}
  .reading{outline:3px solid #5ce1ff!important;outline-offset:2px;box-shadow:0 0 18px rgba(92,225,255,.55)!important;border-radius:10px;transition:outline .2s}
  .body .tag{padding-right:118px}
  .vpanel{position:fixed;inset:0;z-index:120;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;padding:12px;animation:in .25s}
  .vbox{width:min(480px,100%);max-height:88vh;overflow:auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px 16px}
  .vlist{display:grid;grid-template-columns:1fr 1fr;gap:8px}
  .vopt{all:unset;cursor:pointer;padding:10px;border-radius:10px;background:var(--panel2);border:1px solid var(--line);font-size:14px;font-weight:700;line-height:1.3;overflow:hidden}
  .vopt small{display:block;font-weight:500;font-size:11.5px;color:var(--muted)}
  .vopt.on{border-color:var(--cyan);background:rgba(92,225,255,.12)}
  .narr .nb{padding-right:34px;min-height:76px}

  html{scroll-padding:72px 0 160px}
  .narr .nb{pointer-events:none}
  .narr .nb .ctl{pointer-events:auto}
  .novoice-note{display:none}
  body.novoice .novoice-note{display:inline}

  /* ================= ANIMAÇÕES EXTRAS ================= */
  /* Brilho que passa pelos botões */
  .btn{position:relative;overflow:hidden}
  .btn::after{content:'';position:absolute;top:0;left:-60%;width:40%;height:100%;background:linear-gradient(100deg,transparent,rgba(255,255,255,.45),transparent);transform:skewX(-20deg);animation:shine 3.2s ease-in-out infinite}
  .btn.ghost::after{display:none}
  @keyframes shine{0%,60%{left:-60%}100%{left:130%}}
  /* Pontuação pulando */
  .pill.bump{animation:bump .5s cubic-bezier(.3,1.6,.5,1)}
  @keyframes bump{40%{transform:scale(1.35);color:#fff;box-shadow:0 0 16px rgba(245,197,24,.8)}}
  /* Combo */
  .combo{position:fixed;left:50%;top:118px;z-index:70;transform:translateX(-50%);pointer-events:none;text-align:center;animation:combo 1.8s cubic-bezier(.2,1.4,.4,1) forwards}
  .combo b{display:block;font-family:'Black Ops One';font-size:40px;line-height:1;background:linear-gradient(180deg,#fff6a8,#ffb300 45%,#ff4d00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 3px 0 #000) drop-shadow(0 0 14px rgba(255,120,0,.8))}
  .combo small{font-family:'JetBrains Mono',monospace;font-size:12px;color:#ffd27a;letter-spacing:.15em}
  .combo .fire{font-size:34px;display:inline-block;animation:flame .25s infinite alternate}
  @keyframes flame{to{transform:scale(1.15) rotate(6deg)}}
  @keyframes combo{0%{opacity:0;transform:translateX(-50%) scale(.3) rotate(-12deg)}15%{opacity:1;transform:translateX(-50%) scale(1.15) rotate(3deg)}30%{transform:translateX(-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-40px) scale(.9)}}
  /* Explosão de estrelas */
  .star{position:fixed;z-index:65;pointer-events:none;font-size:16px;animation:starfly .9s ease-out forwards}
  @keyframes starfly{0%{transform:translate(0,0) scale(.4) rotate(0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(1.1) rotate(var(--r));opacity:0}}
  /* Onda de acerto */
  .ring{position:fixed;z-index:64;width:20px;height:20px;margin:-10px 0 0 -10px;border-radius:50%;border:3px solid #4ade80;pointer-events:none;animation:ringo .7s ease-out forwards}
  @keyframes ringo{to{transform:scale(9);opacity:0}}
  /* Glitch no erro */
  .scene.glitch svg{animation:glitch .5s steps(1)}
  @keyframes glitch{
    0%{transform:none;filter:none}
    15%{transform:translate(-6px,2px);filter:drop-shadow(4px 0 #ff00d4) drop-shadow(-4px 0 #00e5ff);clip-path:inset(10% 0 55% 0)}
    30%{transform:translate(5px,-3px);clip-path:inset(55% 0 8% 0)}
    45%{transform:translate(-3px,0);filter:hue-rotate(90deg) saturate(2);clip-path:inset(30% 0 30% 0)}

  .tr{background:transparent!important}

  .tr .dl{left:0;animation:dclose .38s cubic-bezier(.7,0,.9,.6) both}
  .tr .dr{right:0;animation:dclose2 .38s cubic-bezier(.7,0,.9,.6) both}
  .tr .dl::before,.tr .dr::before{content:'';position:absolute;inset:18px;background:repeating-linear-gradient(0deg,transparent 0 44px,rgba(0,0,0,.35) 44px 47px),radial-gradient(circle at 12px 12px,#9aa3ad 3px,transparent 4px) 0 0/48px 48px;opacity:.7}
  .tr .dl::after{content:'';position:absolute;right:0;top:0;bottom:0;width:8px;background:repeating-linear-gradient(-45deg,var(--yellow) 0 10px,#111 10px 20px)}

  @keyframes dclose{from{transform:translateX(-100%)}to{transform:none}}
  @keyframes dclose2{from{transform:translateX(100%)}to{transform:none}}
  .tr .box,.tr .sweep,.tr .strip,.tr .skip{z-index:2}

  @keyframes slam2{0%{background:rgba(255,255,255,.7)}100%{background:transparent}}
  .tr.shakeit{animation:trshake .35s .36s}
  @keyframes trshake{25%{transform:translate(-8px,4px)}50%{transform:translate(7px,-3px)}75%{transform:translate(-4px,2px)}}
  .tr.out{animation:none!important;pointer-events:none}

  @keyframes dopen{to{transform:translateX(-102%)}}

<script>
/* ================= SOM ================= */
/* Efeitos sonoros sintetizados (Web Audio). Pensados para alto-falante de celular:
   frequências médias/agudas (o celular não reproduz graves), volume reforçado
   e destravamento do áudio a cada toque (os navegadores começam com o som pausado). */
let AC=null,MASTER=null,NOISE=null,muted=false;
function ctx(){
  if(!AC){
    const C=window.AudioContext||window.webkitAudioContext;if(!C)return null;
    try{
      AC=new C();
      const comp=AC.createDynamicsCompressor();comp.threshold.value=-14;comp.ratio.value=6;
      MASTER=AC.createGain();MASTER.gain.value=1.6;MASTER.connect(comp);comp.connect(AC.destination);
      const n=AC.createBuffer(1,AC.sampleRate,AC.sampleRate),d=n.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;NOISE=n;
    }catch(e){AC=null;return null}
  }
  if(AC.state!=='running'){try{AC.resume()}catch(e){}}
  return AC;
}
function unlockAudio(){
  const c=ctx();if(!c)return;
  try{const s=c.createBufferSource();s.buffer=c.createBuffer(1,1,22050);s.connect(c.destination);s.start(0)}catch(e){}
}
['pointerdown','touchend','keydown','click'].forEach(ev=>document.addEventListener(ev,unlockAudio,{capture:true,passive:true}));
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&AC&&AC.state!=='running'){try{AC.resume()}catch(e){}}});
try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}   /* iPhone: toca mesmo com a chave do silencioso */
function tone(f,d,type='sine',v=.15,when=0,slide){
  if(muted)return;
  const c=ctx();if(!c)return;
  try{
    const t=c.currentTime+when+.01,o=c.createOscillator(),g=c.createGain();
    o.type=type;o.frequency.setValueAtTime(f,t);if(slide)o.frequency.exponentialRampToValueAtTime(slide,t+d);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(v,t+.008);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    o.connect(g);g.connect(MASTER);o.start(t);o.stop(t+d+.03);
  }catch(e){}
}
function noise(d,v=.3,when=0,freq=2000,q=1.2){
  if(muted)return;
  const c=ctx();if(!c||!NOISE)return;
  try{
    const t=c.currentTime+when+.01,s=c.createBufferSource(),f=c.createBiquadFilter(),g=c.createGain();
    s.buffer=NOISE;f.type='bandpass';f.frequency.value=freq;f.Q.value=q;
    g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.0001,t+d);
    s.connect(f);f.connect(g);g.connect(MASTER);s.start(t,Math.random()*.5);s.stop(t+d+.03);
  }catch(e){}
}
const sfx={
  click:()=>tone(1800,.05,'square',.07),
  ok:()=>{tone(880,.13,'triangle',.3);tone(1320,.22,'triangle',.3,.09);tone(1760,.25,'sine',.12,.16)},
  bad:()=>{tone(440,.28,'sawtooth',.16,0,220);tone(466,.28,'square',.08,.02,233)},
  clank:()=>{noise(.35,.7,0,2600,2);tone(330,.35,'square',.18,0,165);tone(1250,.1,'square',.1,.03);noise(.15,.5,.12,4000,3)},
  alarm:()=>[0,.3,.6].forEach(t=>tone(700,.25,'sawtooth',.12,t,1200)),
  win:()=>[523,659,784,1047,1319].forEach((f,i)=>{tone(f,.3,'triangle',.22,i*.12);tone(f*2,.2,'sine',.06,i*.12)}),
  tick:()=>tone(2600,.03,'square',.06),
  dark:()=>{tone(330,.6,'sawtooth',.14,0,165);tone(392,.8,'triangle',.16,.1,196)},
  cough:()=>[0,.22,.42].forEach(t=>{noise(.14,.6,t,900,1.5);tone(300,.12,'sawtooth',.08,t,220)}),
  run:()=>{for(let i=0;i<9;i++){noise(.04,.35,i*.22,1500,2);tone(600+(i%2)*120,.05,'square',.06,i*.22)}},
  slam:()=>{noise(.45,.8,0,1800,1.5);tone(260,.45,'square',.2,0,130);tone(900,.12,'square',.08,.02)},
  pop:()=>{noise(.3,.35,0,3000,1);tone(500+Math.random()*300,.25,'triangle',.08,0,200)}

    ${front}${acc}`;
}

let t0=null,tick=null,errors=0,score=0,done=0,ph=0,st=0,lockIdx=0,firstTry=true;
let F=100,FMAX=100,D=0,hints=0,ally=false,skipNext=false,choices=[];
const TOTAL=15;
let pendingExtra=[],VARAL='';

function startTimer(){t0=Date.now();clearInterval(tick);tick=setInterval(()=>{$('#timer').textContent=fmt(Date.now()-t0)},1000)}
function drawProg(){$('#prog').innerHTML=Array.from({length:TOTAL},(_,i)=>`<i class="${i<done?'on':i===done&&t0?'cur':''}"></i>`).join('')}
function popText(txt,color){const d=document.createElement('div');d.className='delta';d.style.color=color;d.textContent=txt;document.body.appendChild(d);setTimeout(()=>d.remove(),1700)}
function addPts(n){score+=n;const sp=$('#score');sp.textContent='⭐ '+score;sp.classList.remove('bump');void sp.offsetWidth;sp.classList.add('bump');const d=document.createElement('div');d.className='pts';d.textContent=(n>0?'+':'')+n;if(n<0)d.style.color='#ff4d4d';document.body.appendChild(d);setTimeout(()=>d.remove(),1200)}
function drawStatus(){
  const st=$('#status');st.classList.remove('hidden');
  $('#stav').innerHTML=avatarSVG(CH);
  $('#stnm').textContent=CH.name;
  $('#stpk').textContent=PERKS[CH.p].i+' '+PERKS[CH.p].n+(CH.p===1?` · ${hints} pista${hints===1?'':'s'}`:'');
  $('#mf').style.width=(F/FMAX*100)+'%';$('#mfv').textContent=F;
  $('#mf').parentElement.parentElement.classList.toggle('low',F<70);
  $('#md').style.width=D+'%';$('#mdv').textContent=D;
}
function changeMeters(df,dd){
  if(df){F=clamp(F+df,0,FMAX);const m=$('#mf').parentElement.parentElement;m.classList.remove('hit');void m.offsetWidth;m.classList.add('hit');popText((df>0?'+':'')+df+' 🫁 fôlego',df<0?'#ff8080':'#4ade80')}
  if(dd){D=clamp(D+dd,0,100);const m=$('#md').parentElement.parentElement;m.classList.remove('hit');void m.offsetWidth;m.classList.add('hit');setTimeout(()=>popText((dd>0?'+':'')+dd+' ⛓️ dependência',dd>0?'#d48bff':'#4ade80'),dd&&df?500:0)}
  drawStatus();
}
function flash(c){const f=$('#sc .flash');if(!f)return;f.className='flash';void f.offsetWidth;f.className='flash '+c}
function shakeScene(){const sc=$('#sc');if(!sc)return;sc.classList.remove('shake');void sc.offsetWidth;sc.classList.add('shake')}
function sparks(){const sc=$('#sc');for(let i=0;i<26;i++){const s=document.createElement('div');s.className='spark';s.style.left=(30+Math.random()*40)+'%';s.style.top=(35+Math.random()*30)+'%';s.style.setProperty('--dx',(Math.random()*240-120)+'px');s.style.setProperty('--dy',(Math.random()*160-90)+'px');s.style.animationDelay=(Math.random()*.25)+'s';sc.appendChild(s);setTimeout(()=>s.remove(),1400)}}
function confetti(){const cs=['#ff8a1f','#f5c518','#4ade80','#5ce1ff','#ff6fd8'];for(let i=0;i<90;i++){const c=document.createElement('div');c.className='confetti';c.style.left=Math.random()*100+'vw';c.style.background=cs[i%cs.length];c.style.animationDuration=(2+Math.random()*2.5)+'s';c.style.animationDelay=(Math.random()*.8)+'s';c.style.borderRadius=Math.random()>.5?'50%':'2px';document.body.appendChild(c);setTimeout(()=>c.remove(),5500)}}

function renderPlain(html){S.innerHTML=`<div class="card"><div class="body in" id="body">${html}</div></div>`;window.scrollTo({top:0,behavior:'smooth'})}
function renderScene(scene,label,locks=3,clank='CLANK! 🔓',arg){
  S.innerHTML=`<div class="card"><div class="scene" id="sc">${SCENES[scene](arg)}
    ${dustHTML()}<div class="scanlines"></div><div class="clank">${clank}</div><div class="label">${label}</div>

function setBody(html){const b=$('#body');b.innerHTML=`<button class="relisten" type="button">🔁 Ouvir de novo</button><div class="in">${html}</div>`;if(NARR.on)readScreen();return b}
function head(tag,title){return `<div class="tag">${tag}</div><h2>${title}</h2>`}

/* ---------- Acerto, erro e avanço ---------- */
function nextStep(){st++;runStep()}
function solved(html,opts={}){
  if(!opts.silent){
    let bonus=0;if(firstTry){combo++;if(combo>=2){bonus=(combo-1)*20;setTimeout(()=>showCombo(combo),250)}}else combo=0;
    sfx.ok();addPts((firstTry?100:50)+bonus);say(pick(N.cheer));
    burst(document.querySelector('#body .opt.right:last-of-type,#body .door.ok,#body .ch.pick')||document.querySelector('#body .in'));
  }
  done++;drawProg();
  const l=document.querySelectorAll('#sc .plocks span')[lockIdx];if(l){l.textContent='🔓';l.classList.add('ok')}
  lockIdx++;
  const last=st===PH[ph].steps.length-1,fb=$('#fb');
  fb.innerHTML=`<div class="fb good">${html}${LISTEN}</div><button class="btn ${last?'go':''}" id="nx">${last?'🔓 Abrir a grade!':'➡️ Continuar'}</button>`;
  $('#nx').onclick=()=>{sfx.click();if(last)phaseEnd();else nextStep()};
  scrollToEl(fb);
}
function failed(html,block=true){
  sfx.bad();errors++;firstTry=false;combo=0;shakeScene();flash('red');glitch();
  if(block){const fb=$('#fb');fb.innerHTML=`<div class="fb bad">${html}${LISTEN}</div>`;scrollToEl(fb);say(pick(N.oops))}
}
function reflect(r){return `<div class="reflect"><div class="tag">⚡ Pergunta-relâmpago</div><p style="margin:0">${r.q}</p>
  <div class="chips">${r.chips.map(c=>`<button class="chip">${c}</button>`).join('')}</div>
  <p class="muted" id="rmsg" style="margin:10px 0 0;display:none">${r.after}</p></div>`}
function bindReflect(){document.querySelectorAll('.chip').forEach(c=>c.onclick=()=>{sfx.click();document.querySelectorAll('.chip').forEach(x=>x.classList.remove('on'));c.classList.add('on');$('#rmsg').style.display='block'})}

function mcq(c){
  const canHint=CH.p===1&&hints>0;
  const b=setBody(`${head(c.tag,c.title)}${c.intro||''}<p><b>${c.q}</b></p>
    <div class="opts">${c.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${'ABCD'[i]}</span><span>${o.t}</span></button>`).join('')}</div>
    ${canHint?`<button class="hintbtn" id="hint">💻 Usar pista hacker (${hints})</button>`:''}<div id="fb"></div>`);
  if(canHint)$('#hint').onclick=()=>{
    const wr=[...b.querySelectorAll('.opt')].filter(x=>!c.opts[+x.dataset.i].ok&&!x.classList.contains('wrong'));
    if(!wr.length)return;
    const x=wr[Math.floor(Math.random()*wr.length)];x.classList.add('wrong');x.style.animation='none';
    hints--;sfx.tick();drawStatus();$('#hint').remove();
  };
  b.querySelectorAll('.opt').forEach(btn=>btn.onclick=()=>{
    if(btn.classList.contains('wrong')||b.querySelector('.opt.right'))return;
    const o=c.opts[+btn.dataset.i];
    if(o.ok){btn.classList.add('right');b.querySelectorAll('.opt').forEach(x=>x.setAttribute('aria-disabled','true'));const h=$('#hint');if(h)h.remove();solved(c.explain)}
    else{btn.classList.add('wrong');failed(`<h3>🚨 Alarme! Essa não abre.</h3>${o.why}<p class="muted" style="margin-top:8px">Use a pista e tente outra 👆</p>`)}
  });
}

function mythTruth(c){
  let i=0,hits=0;
  function card(){
    const it=c.items[i];
    setBody(`${head(c.tag,c.title)}<p class="muted">${c.intro}</p>
      <div class="mvcount">CARTA ${i+1} DE ${c.items.length}</div>
      <div class="mvcard" id="mv"><div class="mvinner">
        <div class="mvface mvfront"><small>DETENTO ANTIGO DIZ:</small>"${it.s}"</div>
        <div class="mvface mvback" id="mvb"></div></div></div>
      <div class="mvbtns" id="mvbtns"><button class="bm" data-v="0">🚫 MITO</button><button class="bv" data-v="1">✅ VERDADE</button></div>
      <div id="fb"></div>`);
    document.querySelectorAll('#mvbtns button').forEach(bt=>bt.onclick=()=>{
      const ans=bt.dataset.v==='1',right=ans===it.v;
      $('#mvbtns').remove();
      const back=$('#mvb');
      back.innerHTML=`<h4>${right?'✅ Acertou!':'🔁 Quase!'} É ${it.v?'VERDADE':'MITO'}.</h4>${it.e}`;
      if(!it.v)back.classList.add('no');
      $('#mv').classList.add('flip');
      if(right){hits++;sfx.ok()}else{failed('',false)}
      setTimeout(()=>{
        if(i<c.items.length-1){$('#fb').innerHTML=`<button class="btn" id="nc">Próxima carta →</button>`;$('#nc').onclick=()=>{sfx.click();i++;card()}}
        else solved(`<h3>🔓 Cadeado aberto! Você acertou ${hits} de ${c.items.length}.</h3>${c.explain}`);
      },650);
    });
  }
  card();
}

function scanner(c){
  const b=setBody(`${head(c.tag,c.title)}${c.intro}<p><b>${c.q}</b></p>
    <div class="scan">${c.items.map((it,k)=>`<button class="sc" data-k="${k}">${it.t}</button>`).join('')}</div>
    <div class="counter" id="cnt">Selecionados: 0</div>
    <button class="btn" id="go">📡 Escanear</button><div id="fb"></div>`);
  const sel=new Set();
  b.querySelectorAll('.sc').forEach(x=>x.onclick=()=>{sfx.tick();const k=+x.dataset.k;sel.has(k)?sel.delete(k):sel.add(k);x.classList.toggle('on');x.classList.remove('miss','bad');readNow([{text:x.innerText+(x.classList.contains('on')?', marcado':', desmarcado'),el:x}]);$('#cnt').textContent='Selecionados: '+sel.size});
  $('#go').onclick=()=>{
    const wrong=[...sel].filter(k=>!c.items[k].ok),miss=c.items.map((it,k)=>it.ok&&!sel.has(k)?k:-1).filter(k=>k>=0);
    if(!wrong.length&&!miss.length){$('#go').remove();b.querySelectorAll('.sc').forEach(x=>x.style.pointerEvents='none');solved(c.explain);return}
    wrong.forEach(k=>b.querySelector(`.sc[data-k="${k}"]`).classList.add('bad'));
    failed(`<h3>🚨 O scanner apitou!</h3>${wrong.length?`<p data-say="Os itens em vermelho não fazem parte do aerossol.">Em vermelho: ${wrong.map(k=>c.items[k].why).join(' ')}</p>`:''}${miss.length?`<p data-say="E ainda falta coisa que está no aerossol. Procure de novo!">E ainda falta${miss.length>1?'m':''} <b>${miss.length}</b> substância${miss.length>1?'s':''} que está${miss.length>1?'o':''} no aerossol. Procure de novo!</p>`:''}`);
  };
}

function dial(c){
  let idx=0,rot=0;const n=c.vals.length,step=360/n;
  const b=setBody(`${head(c.tag,c.title)}${c.intro}${ally?`<div class="npc"><div class="face">🐀</div><div class="say"><small>Rato (seu aliado)</small>Psiu… ouvi o diretor dizer que é a idade em que o cérebro "fica pronto". Bem depois dos 20, mas antes dos 30.</div></div>`:''}<p><b>${c.q}</b></p>
    <div class="dialwrap"><svg viewBox="0 0 200 200">
      <circle cx="100" cy="100" r="96" fill="#1c1e22" stroke="#5d6570" stroke-width="4"/>
      <circle cx="100" cy="100" r="82" fill="#3a4048" stroke="#9aa3ad" stroke-width="2"/>
      <g class="ring" id="ring">${c.vals.map((v,i)=>`<g transform="rotate(${i*step} 100 100)"><text x="100" y="42" text-anchor="middle" font-family="JetBrains Mono,monospace" font-size="17" font-weight="700" fill="#e8ecf0">${v}</text><rect x="99" y="22" width="2" height="6" fill="#9aa3ad"/></g>`).join('')}
        ${Array.from({length:n*4},(_,i)=>`<rect x="99.5" y="20" width="1" height="4" fill="#6b737d" transform="rotate(${i*step/4} 100 100)"/>`).join('')}</g>
      <circle cx="100" cy="100" r="30" fill="#5d6570" stroke="#2a2e33" stroke-width="3"/><circle cx="100" cy="100" r="8" fill="#d7dde4"/>
      <polygon points="100,4 92,16 108,16" fill="#f5c518"/></svg>
      <div class="dialbtns"><button id="dl">⟲</button><div class="dialval" id="dv">${c.vals[0]}</div><button id="dr">⟳</button></div></div>
    <button class="btn" id="go">🔐 Testar combinação</button><div id="fb"></div>`);
  const upd=d=>{idx=(idx+d+n)%n;rot-=d*step;$('#ring').style.transform=`rotate(${rot}deg)`;$('#dv').textContent=c.vals[idx];sfx.tick();readNow([{text:String(c.vals[idx])}]);setTimeout(sfx.tick,60)};
  $('#dl').onclick=()=>upd(-1);$('#dr').onclick=()=>upd(1);
  $('#go').onclick=()=>{
    const v=c.vals[idx];
    if(v===c.answer){$('#go').remove();b.querySelector('.dialbtns').style.pointerEvents='none';solved(c.explain)}
    else failed(`<h3>🚨 Combinação errada!</h3><p>${v<c.answer?c.low:c.high}</p>`);
  };
}

function order(c){
  if(skipNext){
    skipNext=false;
    setBody(`${head(c.tag,c.title)}<div class="story">O cadeado já está aberto: o <b>Diretor</b> destrancou com o atalho. Mas você não aprendeu como o Nico prende os detentos… e ele já está te prendendo.</div><div id="fb"></div>`);
    solved(`<h3>🔓 Aberto pelo atalho (0 pontos)</h3><p>Para registro, a armadilha do Nico é: nicotina chega ao cérebro → pico de dopamina → queda e vontade de usar de novo → o cérebro se adapta e pede mais.</p>`,{silent:true});
    return;
  }
  let picked=[];
  const draw=()=>{
    picked=[];
    const b=setBody(`${head(c.tag,c.title)}${c.intro}<p class="muted">Toque nas etapas na ordem em que acontecem.</p>
      <div class="order">${c.items.map((_,i)=>`<div class="slot" id="s${i}"><span class="n">${i+1}</span><span>…</span></div>`).join('')}</div>
      <div class="pool">${c.shuffle.map(k=>`<button class="opt" data-id="${k}"><span>${c.items[k]}</span></button>`).join('')}</div>
      <button class="btn ghost" id="reset">↺ Girar o disco de novo</button><div id="fb"></div>`);
    b.querySelectorAll('.pool .opt').forEach(x=>x.onclick=()=>{
      if(x.classList.contains('sel')||picked.length>=c.items.length)return;
      sfx.tick();x.classList.add('sel');x.setAttribute('aria-disabled','true');
      const k=+x.dataset.id;picked.push(k);
      const s=$('#s'+(picked.length-1));s.classList.add('filled');s.lastChild.textContent=c.items[k];
      if(picked.length===c.items.length){
        if(picked.every((v,i)=>v===i)){$('#reset').remove();solved(c.explain)}
        else failed(`<h3>🚨 Combinação errada!</h3>${c.hint}<p class="muted" style="margin-top:8px">Toque em ↺ e tente de novo.</p>`);
      }
    });
    $('#reset').onclick=()=>{sfx.click();draw()};
  };
  draw();
}

function hunt(c){
  const b=setBody(`${head(c.tag,c.title)}${c.intro}
    <div class="post hunting"><div class="ph">🍉✨💨</div><div class="pb" data-say="O post diz: Novo sabor melancia gelo! Todo mundo da galera já tá usando, nem tem cheiro e é tão leve. Hashtag aesthetic, hashtag vibe. Quarenta e oito mil curtidas. Agora toque nas cinco iscas escondidas no texto."><div class="pu">@vibe.cloudz ✔️</div>${c.post}</div></div>
    <div class="counter" id="cnt">Iscas encontradas: 0 / ${Object.keys(c.baits).length}</div>
    <div class="baitlog" id="log"></div><div id="fb"></div>`);
  const total=Object.keys(c.baits).length;let found=0,decoyHits=0;
  b.querySelectorAll('.seg').forEach(s=>s.onclick=()=>{
    const k=s.dataset.k;
    if(s.classList.contains('found')||found===total)return;
    if(c.baits[k]){
      s.classList.add('found');found++;sfx.ok();
      $('#log').insertAdjacentHTML('beforeend',`<div class="bait">🎣 ${c.baits[k]}</div>`);
      $('#cnt').textContent=`Iscas encontradas: ${found} / ${total}`;
      {const lb=$('#log').lastElementChild;readNow([{text:lb.innerText,el:lb}])}
      if(found===total){firstTry=decoyHits===0;solved(c.explain)}
    }else{
      decoyHits++;sfx.bad();s.classList.remove('nope');void s.offsetWidth;s.classList.add('nope');
      $('#cnt').textContent=`"${s.textContent.trim()}" é só parte do app, não é isca. Iscas: ${found} / ${total}`;readNow([{text:s.textContent.trim()+' é só parte do app, não é isca. Continue procurando!'}]);
    }
  });
}

function chat(c){
  let r=0;
  setBody(`${head(c.tag,c.title)}${c.intro}<div class="chat" id="chat"></div><div id="q"></div><div id="fb"></div>`);
  const box=$('#chat');
  function sayMsgs(msgs,cb){
    let k=0;
    (function next(){
      if(k>=msgs.length)return cb();
      const t=document.createElement('div');t.className='bub';t.innerHTML='<span class="dots"><i></i><i></i><i></i></span>';t.style.padding='0';box.appendChild(t);
      setTimeout(()=>{t.style.padding='';t.innerHTML=`<small>${msgs[k][0]}</small>${msgs[k][1]}`;sfx.tick();speakItems([{text:msgs[k][0]+' diz: '+msgs[k][1],el:t}],true);k++;setTimeout(next,350)},800);
    })();
  }
  function round(){
    const R=c.rounds[r];
    sayMsgs(R.msgs,()=>{
      const q=$('#q');
      q.innerHTML=`<p><b>${R.q}</b></p><div class="opts">${R.opts.map((o,i)=>`<button class="opt" data-i="${i}"><span class="k">${'ABCD'[i]}</span><span>${o.t}</span></button>`).join('')}</div>`;
      scrollToEl(q);speakItems(itemsFrom(q),true);
      q.querySelectorAll('.opt').forEach(btn=>btn.onclick=()=>{
        if(btn.classList.contains('wrong'))return;
        const o=R.opts[+btn.dataset.i];
        if(o.ok){
          q.innerHTML='';$('#fb').innerHTML='';
          const me=document.createElement('div');me.className='bub me';me.innerHTML=`<small>${esc(CH.name)}</small>${o.t.replace(/^"|"$/g,'')}`;box.appendChild(me);sfx.ok();say(pick(N.cheer));
          r++;
          if(r<c.rounds.length)setTimeout(round,600);
          else setTimeout(()=>solved(c.explain),500);
        }else{btn.classList.add('wrong');failed(`<h3>🚨 Essa ainda não abre.</h3>${o.why}`)}
      });
    });
  }
  round();
}

function choice(c){
  const b=setBody(`<span class="choice-tag">⚠️ ESCOLHA · NÃO DÁ PARA VOLTAR</span><h2>${c.title}</h2>${c.story}
    <p><b>${c.q}</b></p><div class="opts" id="chs">${c.opts.map((o,i)=>`<button class="ch" data-i="${i}">${o.t}</button>`).join('')}</div><div id="fb"></div>`);
  b.querySelectorAll('.ch').forEach(btn=>btn.onclick=()=>{
    const o=c.opts[+btn.dataset.i];
    b.querySelectorAll('.ch').forEach(x=>x.classList.add('dim'));btn.classList.remove('dim');btn.classList.add('pick');
    choices.push({ph:ph+1,txt:o.log,good:o.good});
    const fx=[];
    if(o.f)fx.push(`${o.f>0?'+':''}${o.f} 🫁 Fôlego`);
    if(o.d)fx.push(`${o.d>0?'+':''}${o.d} ⛓️ Dependência`);
    let pts=o.pts||0;if(o.good&&CH.p===2)pts+=50;
    if(pts)fx.push(`${pts>0?'+':''}${pts} ⭐`);
    if(o.good){sfx.ok()}else{sfx.dark();flash('red');shakeScene()}
    say(pick(o.good?N.good:N.bad));
    changeMeters(o.f||0,o.d||0);if(pts)addPts(pts);
    const rhtml=typeof o.r==='function'?o.r():o.r;
    if(o.fx)o.fx();
    const fb=$('#fb');
    fb.innerHTML=`<div class="conseq ${o.good?'good':'bad'}">${rhtml}${fx.length?`<div class="fx">${fx.map(x=>`<span>${x}</span>`).join('')}</div>`:''}${LISTEN}</div><button class="btn" id="nx">➡️ Continuar</button>`;
    $('#nx').onclick=()=>{sfx.click();nextStep()};
    scrollToEl(fb);
  });
}

function craving(){
  if(D<30){nextStep();return}
  sfx.dark();
  $('#sc').classList.add('crave');
  const b=setBody(`<span class="choice-tag">😵 CRISE DE FISSURA</span><h2>O Nico está cobrando</h2>
    <div class="story">No meio do pátio, sua mão treme e o peito aperta. É a <b>abstinência</b>: irritação, ansiedade e uma vontade enorme de dar um trago. Essa é a consequência das doses que você aceitou.</div>
    <p>A fissura vem em ondas e <b>passa em poucos minutos</b>. Respire fundo para atravessar a onda:</p>
    <div class="breath"><div class="bcirc" id="bc"></div><div class="blbl" id="bl">Segure o botão para inspirar</div><div class="bdots">${'<i></i>'.repeat(3)}</div></div>
    <button class="btn holdbtn" id="hold">🫁 Segure para inspirar</button>
    <button class="btn ghost" id="give">😮‍💨 Ceder e dar um trago</button><div id="fb"></div>`);
  let state='ready',cycles=0,tm=null;
  const bc=$('#bc'),bl=$('#bl'),hold=$('#hold');
  const down=e=>{e.preventDefault();if(state!=='ready')return;state='in';bc.classList.add('big');bl.textContent='Inspirando… 1, 2, 3';tm=setTimeout(()=>{state='full';bl.textContent='Agora solte e expire devagar';sfx.tick()},3000)};
  const up=()=>{
    if(state==='in'){clearTimeout(tm);state='ready';bc.classList.remove('big');bl.textContent='Rápido demais! Segure por 3 segundos.';return}
    if(state!=='full')return;
    state='out';bc.classList.remove('big');bl.textContent='Expirando… 1, 2, 3';hold.setAttribute('disabled','');
    setTimeout(()=>{
      cycles++;document.querySelectorAll('.bdots i')[cycles-1].classList.add('on');sfx.ok();
      if(cycles>=3){
        state='done';$('#sc').classList.remove('crave');hold.remove();$('#give').remove();
        choices.push({ph:ph+1,txt:'Atravessou a crise de fissura respirando',good:true});
        changeMeters(0,-10);addPts(50);
        $('#fb').innerHTML=`<div class="conseq good"><h3>🌊 A onda passou!</h3><p>Você atravessou a fissura sem ceder. Respirar fundo, beber água, se mexer e conversar com alguém ajudam. Cada fissura vencida enfraquece a corrente.</p><div class="fx"><span>−10 ⛓️ Dependência</span><span>+50 ⭐</span></div></div><button class="btn" id="nx">➡️ Continuar</button>`;
        $('#nx').onclick=()=>{sfx.click();nextStep()};scrollToEl($('#fb'));
      }else{state='ready';hold.removeAttribute('disabled');bl.textContent='Mais uma vez: segure para inspirar'}
    },3000);
  };
  hold.addEventListener('pointerdown',down);hold.addEventListener('pointerup',up);hold.addEventListener('pointerleave',up);hold.addEventListener('pointercancel',up);
  hold.oncontextmenu=e=>e.preventDefault();
  $('#give').onclick=()=>{
    clearTimeout(tm);$('#sc').classList.remove('crave');sfx.dark();
    hold.remove();$('#give').remove();
    choices.push({ph:ph+1,txt:'Cedeu à fissura e deu outro trago',good:false});
    changeMeters(-15,15);
    $('#fb').innerHTML=`<div class="conseq bad"><h3>⛓️ Alívio de 5 minutos</h3><p>A fissura passou… porque você deu ao Nico o que ele queria. É assim que o ciclo se fecha: o "alívio" é só o fim da falta que a própria nicotina criou. Da próxima vez, a vontade volta mais forte.</p><div class="fx"><span>−15 🫁 Fôlego</span><span>+15 ⛓️ Dependência</span></div></div><button class="btn" id="nx">➡️ Continuar</button>`;
    $('#nx').onclick=()=>{sfx.click();nextStep()};scrollToEl($('#fb'));
  };
}

function race(){
  setBody(`<span class="choice-tag">🏃 TESTE DE FÔLEGO</span><h2>Corrida pelo pátio</h2>
    <div class="story" data-say="O holofote vai varrer o pátio de novo em segundos. Você precisa atravessar correndo até o portão sem ser visto. Olhe o seu fôlego no topo da tela.">O holofote vai varrer o pátio de novo em segundos. Você precisa <b>atravessar correndo</b> até o portão sem ser visto. Seu fôlego agora: <b>${F}</b>.<span hidden></span></div>

    $('#run').remove();sfx.run();

        $('#fb').innerHTML=`<div class="conseq good"><h3>💨 Chegou ao portão!</h3><p>Pulmão sem irritação faz diferença: você correu sem tossir e ninguém te viu.</p><div class="fx"><span>+50 ⭐</span></div></div><button class="btn" id="nx">➡️ Continuar</button>`;
        $('#nx').onclick=()=>{sfx.click();nextStep()};scrollToEl($('#fb'))},2300);
      return;
    }
    sc.classList.add('runfail');
    setTimeout(()=>{
      sfx.cough();shakeScene();say(N.raceBad);
      if(ally){
        choices.push({ph:ph+1,txt:'Travou de tosse na corrida, mas o Rato te salvou',good:false});
        sc.classList.remove('runfail');sc.classList.add('run');
        $('#fb').innerHTML=`<div class="conseq bad"><h3>😮‍💨 Tosse no meio do caminho…</h3><p>Você trava, tossindo e sem ar. Mas o <b>Rato</b> bate na grade do outro lado e o guarda vira o holofote para lá. Ufa! Tosse e falta de ar são sinais de vias aéreas irritadas pelo aerossol.</p></div><button class="btn" id="nx">➡️ Continuar</button>`;
        $('#nx').onclick=()=>{sfx.click();nextStep()};scrollToEl($('#fb'));
      }else{
        sc.classList.add('caught');flash('red');sfx.alarm();
        choices.push({ph:ph+1,txt:'Sem fôlego, foi pego pelo holofote e foi para a solitária',good:false});
        $('#fb').innerHTML=`<div class="conseq bad"><h3>🚨 Pego pelo holofote!</h3><p>A tosse e a falta de ar te travaram no meio do pátio. O aerossol irrita e inflama as vias aéreas, e isso cobra a conta justamente quando você precisa do pulmão.</p><div class="fx"><span>−100 ⭐</span><span>Solitária: 8 s</span></div></div><button class="btn" id="nx">🔒 Ir para a solitária</button>`;
        addPts(-100);
        $('#nx').onclick=()=>{sfx.click();solitary(()=>{
          restoreScene();nextStep();
        })};
        scrollToEl($('#fb'));
      }
    },1500);
  };
}

/* ---------- Transições ---------- */
function transition(label,title,sub,cb,extra){
  sfx.alarm();
  const d=document.createElement('div');d.className='tr'+(extra?' extra':'');
  d.className+=' shakeit';setTimeout(()=>sfx.slam(),360);
  d.innerHTML=`<div class="dl"></div><div class="dr"></div><div class="slam"></div><div class="sweep"></div><div class="strip s1"></div><div class="strip s2"></div>
    <div class="box"><div class="n">${label}</div><div class="t">${title}</div><div class="sub">${sub}</div></div><div class="skip">toque para pular</div>`;
  document.body.appendChild(d);
  let gone=false;const end=()=>{if(gone)return;gone=true;d.classList.add('out');cb();setTimeout(()=>d.remove(),600)};
  d.onclick=end;setTimeout(end,2400);
}
function typeText(el,text,speed=22){
  if(!el||!el.isConnected)return;
  let i=0;el.classList.add('type');
  const iv=setInterval(()=>{if(!el.isConnected){clearInterval(iv);return}el.textContent=text.slice(0,++i);if(i%3===0)sfx.tick();if(i>=text.length){clearInterval(iv);el.classList.add('done')}},speed);
  el.onclick=()=>{clearInterval(iv);el.textContent=text;el.classList.add('done')};
}

  b.querySelectorAll('.organs button').forEach(x=>x.onclick=()=>{sfx.tick();b.querySelectorAll('.organs button').forEach(y=>y.classList.remove('sel'));x.classList.add('sel');sel=+x.dataset.i;readNow([{text:x.innerText,el:x}])});

      x.innerHTML=`<span class="pairtag">✓ ${c.pairs[i].l}</span>`+x.innerHTML;
      ['o'+i,'o'+i+'b'].forEach(id=>{const o=document.getElementById(id);if(o){o.setAttribute('fill',cols[i]);o.classList.add('lit')}});

      x.classList.remove('bad');ob.classList.remove('bad');void x.offsetWidth;x.classList.add('bad');ob.classList.add('bad');

function varal(c){
  const b=setBody(`${head(c.tag,c.title)}${c.intro}
    <div class="varal"><textarea id="vt" maxlength="120" placeholder="Ex.: Seu pulmão não é descartável 💚"></textarea><div class="cnt" id="vc">0/120</div></div>
    <div class="chips">${c.ideas.map(t=>`<button class="chip">${t}</button>`).join('')}</div>
    <button class="btn" id="go" disabled>📌 Pendurar no varal</button><div id="vl"></div><div id="fb"></div>`);
  const vt=$('#vt'),go=$('#go');
  const upd=()=>{$('#vc').textContent=vt.value.length+'/120';vt.value.trim().length>=6?go.removeAttribute('disabled'):go.setAttribute('disabled','')};
  vt.oninput=upd;
  b.querySelectorAll('.chip').forEach(ch=>ch.onclick=()=>{sfx.tick();vt.value=ch.textContent;upd();readNow([{text:ch.textContent,el:ch}])});
  go.onclick=()=>{
    VARAL=vt.value.trim().slice(0,120);enviarVaral(VARAL);
    vt.setAttribute('readonly','');go.remove();b.querySelectorAll('.chip').forEach(x=>x.remove());
    const vl=$('#vl');vl.innerHTML=`<div class="line"></div><div class="postit"></div>`;vl.querySelector('.postit').textContent=VARAL;
    setTimeout(()=>solved(c.explain),900);
  };
}

function chase(c,done){
  let dist=F<70?1:0,idx=0;
  const sc=$('#sc');sc.classList.toggle('d1',dist===1);
  const draw=()=>{
    const q=c.qs[idx];
    setBody(`<span class="choice-tag">🚨 FASE EXTRA · CONSEQUÊNCIA</span><h2>${c.title}</h2>${idx===0?c.intro:''}
      <div class="dist">GUARDA ${[0,1].map(i=>`<i class="${i<dist?'on':''}"></i>`).join('')} ${dist?'chegando perto!':'longe… por enquanto'}</div>
      <div class="qcard"><small>BIFURCAÇÃO ${idx+1} DE ${c.qs.length} · ESCOLHA A PORTA CERTA</small>"${q.s}"</div>
      <div class="doors"><button class="door" data-v="0"><small>🚪</small>MITO</button><button class="door" data-v="1"><small>🚪</small>VERDADE</button></div><div id="fb"></div>`);
    document.querySelectorAll('.door').forEach(d=>d.onclick=()=>{
      document.querySelectorAll('.door').forEach(x=>x.style.pointerEvents='none');
      const right=(d.dataset.v==='1')===q.v;
      const fb=$('#fb');
      if(right){d.classList.add('ok');sfx.run();addPts(30)}
      else{d.classList.add('bad');dist++;errors++;sfx.cough();shakeScene();flash('red');changeMeters(-5,0);sc.classList.remove('d1','d2');sc.classList.add('d'+Math.min(dist,2))}
      const caught=dist>=2;
      fb.innerHTML=`<div class="fb ${right?'good':'bad'}"><h3>${right?'🏃 Porta certa! Você ganhou distância.':'😮‍💨 Porta errada: beco sem saída e tosse…'}</h3><p>É ${q.v?'VERDADE':'MITO'}. ${q.e}</p></div>
        <button class="btn" id="nx">${caught?'🚨 Você foi pego!':idx<c.qs.length-1?'🏃 Próxima bifurcação':'🚪 Atravessar a saída'}</button>`;
      scrollToEl(fb);
      $('#nx').onclick=()=>{
        sfx.click();
        if(caught){choices.push({ph:'Extra',txt:'Foi pego pelo guarda na perseguição',good:false});addPts(-50);solitary(done);return}
        idx++;
        if(idx<c.qs.length)draw();
        else{
          sc.classList.add('escaped');sfx.ok();addPts(50);
          choices.push({ph:'Extra',txt:'Escapou da perseguição no corredor',good:true});
          setBody(`<span class="choice-tag">🚨 FASE EXTRA · CONSEQUÊNCIA</span><h2>Despistou o guarda!</h2><div class="conseq good"><p>${c.win}</p><div class="fx"><span>+50 ⭐</span></div></div><button class="btn" id="nx">➡️ Voltar para a fuga</button>`);
          $('#nx').onclick=()=>{sfx.click();done()};
        }
      };
    });
  };
  draw();
}

/* Desafio único usado dentro de uma fase extra */
function extraScan(c,done){
  const b=setBody(`<span class="choice-tag">🚨 FASE EXTRA · CONSEQUÊNCIA</span><h2>${c.title}</h2>${c.intro}<p><b>${c.q}</b></p>
    <div class="scan">${c.items.map((it,k)=>`<button class="sc" data-k="${k}">${it.t}</button>`).join('')}</div>
    <button class="btn" id="go">${c.btn}</button><div id="fb"></div>`);
  const sel=new Set();let tries=0;
  b.querySelectorAll('.sc').forEach(x=>x.onclick=()=>{sfx.tick();const k=+x.dataset.k;sel.has(k)?sel.delete(k):sel.add(k);x.classList.toggle('on');x.classList.remove('bad');readNow([{text:x.innerText+(x.classList.contains('on')?', marcado':', desmarcado'),el:x}])});
  $('#go').onclick=()=>{
    const wrong=[...sel].filter(k=>!c.items[k].ok),miss=c.items.filter((it,k)=>it.ok&&!sel.has(k)).length;
    if(!wrong.length&&!miss){
      $('#go').remove();b.querySelectorAll('.sc').forEach(x=>x.style.pointerEvents='none');sfx.ok();addPts(tries?20:40);
      choices.push({ph:'Extra',txt:c.log,good:false});
      if(c.after)c.after();
      $('#fb').innerHTML=`<div class="fb good">${c.explain}</div><button class="btn" id="nx">➡️ Voltar para a fuga</button>`;
      $('#nx').onclick=()=>{sfx.click();done()};scrollToEl($('#fb'));return;
    }
    tries++;wrong.forEach(k=>b.querySelector(`.sc[data-k="${k}"]`).classList.add('bad'));
    failed(`<h3>🚨 Ainda não.</h3>${wrong.length?`<p data-say="Os itens em vermelho não estão certos.">${wrong.map(k=>c.items[k].why).join(' ')}</p>`:''}${miss?`<p data-say="Ainda falta marcar alguma coisa. Olhe de novo!">Falta${miss>1?'m':''} <b>${miss}</b>. Olhe de novo!</p>`:''}`);
  };
}

      r:`<h3>🕵️ Desmascarado</h3><p>"…Porque cliente viciado volta sempre", ele deixa escapar, e logo se arrepende. <b>Você entendeu o modelo de negócio</b>: quanto antes alguém começa, mais tempo fica preso.</p>`}]}),
   ()=>order({tag:'Fase 2 · Cadeado 2 de 3',title:'🔁 A armadilha do Nico',
    intro:`<div class="story">Segundo cadeado. No visor: <b>"Coloque em ordem como o Nico prende os detentos."</b></div>`,
    items:['⚡ A nicotina chega ao cérebro em poucos segundos','😌 Pico de dopamina: sensação de prazer ou alívio','📉 O efeito passa rápido: irritação, ansiedade e vontade de usar de novo','🔁 O cérebro se adapta e precisa de mais para sentir o mesmo'],
    shuffle:[2,0,3,1],
    hint:`<p>Pista: tudo começa com a nicotina <b>chegando</b> ao cérebro. Depois vem a <b>recompensa</b> (dopamina), em seguida a <b>queda</b>, e por último o cérebro <b>se adapta</b> e pede mais.</p>`,
    explain:`<h3>🔓 Esse é o ciclo que prende!</h3><p>A nicotina dispara <b>dopamina</b> no sistema de recompensa, o efeito some rápido e o cérebro passa a cobrar a próxima dose. Com a <b>tolerância</b>, ele precisa de cada vez mais. Alguns pods podem ter tanta nicotina quanto um maço de cigarros, ou mais.</p>`}),
   ()=>mcq({tag:'Fase 2 · Cadeado 3 de 3',title:'😮‍💨 O papo do detento',
    intro:`<div class="npc"><div class="face">🧔</div><div class="say"><small>Detento da cela 12</small>Cara, o vape me acalma. Quando fico ansioso, dou um trago e passa.</div></div>`,
    q:'O que está acontecendo de verdade?',
    opts:[
     {t:'É verdade: nicotina é um tipo de remédio para ansiedade.',why:`<p>Nicotina não trata ansiedade. Estudos associam o uso em jovens a <b>mais</b> sintomas de ansiedade e depressão, não menos.</p>`},
     {t:'A "calma" é, em boa parte, o alívio da abstinência que a própria nicotina criou. Com o tempo, a ansiedade pode piorar.',ok:true},
     {t:'Só acalma quem já tem ansiedade. Para os outros, não faz efeito.',why:`<p>A nicotina age no cérebro de qualquer pessoa. O "alívio" aparece em quem já está dependente: é o fim da falta que ela mesma causou.</p>`},
     {t:'A nicotina não mexe com o humor, então é só efeito placebo.',why:`<p>Mexe, sim! A nicotina mexe com dopamina e outros neurotransmissores ligados a humor, atenção e estresse. Por isso vicia.</p>`}],
    explain:`<h3>🔓 Cofre destravado!</h3><p>Esse é o golpe do Nico: ele causa a ansiedade da abstinência e depois "vende" o alívio. No cérebro adolescente isso pesa mais e pode afetar <b>atenção, memória, controle de impulsos e humor</b>.</p>`})
  ],
  end:{title:'CLICK! A chave é sua!',html:`<p>Resumo da Fase 2: a nicotina usa a <b>dopamina</b> para viciar rápido, e o cérebro adolescente, que vai estar em obra até ~25 anos, é o alvo mais fácil.</p>`,
   reflect:{q:'Quando bate ansiedade ou tédio, o que te ajuda de verdade?',chips:['🎧 Música','🏃 Me mexer','💬 Conversar','🎮 Jogar','😴 Descansar'],after:'Isso é regulação emocional sem dar a chave pro Nico. 💚'},next:'🩻 Descer até o Raio-X'}},

 {scene:'lab',label:'FASE 3 · SALA DE RAIO-X',title:'O RAIO-X',sub:'O que acontece no corpo',
  steps:[
   ()=>match({tag:'Fase 3 · Cadeado 1 de 3',title:'🫀 Mapa do corpo',

    pairs:[

   ()=>choice({title:'🩺 A consulta',

   ()=>scanner({tag:'Fase 3 · Cadeado 2 de 3',title:'📋 Prontuário de alerta',
    intro:`<p>O cadeado é um prontuário. Marque <b>os sinais que pedem procurar um serviço de saúde</b> em quem usa vape.</p>`,

   ()=>mcq({tag:'Fase 3 · Cadeado 3 de 3',title:'🩻 O raio-X misterioso',

 {scene:'patio',label:'FASE 4 · PÁTIO',title:'O TELÃO',sub:'Redes e desinformação',

   ()=>scanner({tag:'Fase 4 · Cadeado 2 de 3',title:'🔎 Por que tantos experimentam?',

   ()=>mcq({tag:'Fase 4 · Cadeado 3 de 3',title:'🕵️ Checagem de fake',
    intro:`<p>Nos comentários do post, alguém escreveu:</p><div class="post"><div class="comment" data-say="O Léo comentou: li que vape é noventa e cinco por cento mais seguro que cigarro, então pra gente tá liberado."><b>@leo_zz</b> li que vape é 95% mais seguro que cigarro, então pra gente tá liberado 🤙</div></div>`,

services:
  - type: web
    name: fuga-nuvem-doce
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT --proxy-headers --forwarded-allow-ips "*"
    healthCheckPath: /api/saude
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      # Senha do painel do professor (/painel). O Render pede para você digitar ao criar.
      - key: PAINEL_SENHA
        sync: false

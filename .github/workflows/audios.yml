name: Gerar áudios da Brisa

# Roda sozinho quando a lista de falas muda, ou pelo botão "Run workflow" na aba Actions.
on:
  workflow_dispatch:
    inputs:
      voz:
        description: "Voz neural (ex.: pt-BR-FranciscaNeural, pt-BR-ThalitaMultilingualNeural)"
        default: "pt-BR-FranciscaNeural"
      velocidade:
        description: "Velocidade (ex.: -5%, -15%, +0%)"
        default: "-5%"
  push:
    branches: [main]
    paths:
      - "audio/falas.json"
      - "gerar_audios.py"
      - ".github/workflows/audios.yml"

permissions:
  contents: write

concurrency:
  group: audios-brisa
  cancel-in-progress: false

jobs:
  audios:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar gerador de voz
        run: pip install edge-tts
      - name: Gerar os áudios
        run: python3 gerar_audios.py --voz "${{ inputs.voz || 'pt-BR-FranciscaNeural' }}" --velocidade="${{ inputs.velocidade || '-5%' }}"
      - name: Salvar os áudios no repositório
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add audio
          if git diff --cached --quiet; then echo "Nada novo para salvar."; exit 0; fi
          git commit -m "Áudios da Brisa gerados automaticamente"
          git pull --rebase origin main
          git push origin HEAD:main
